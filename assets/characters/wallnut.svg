<style>.float{animation:float 1.8s ease-in-out infinite alternate;transform-origin:128px 154px}.run{animation:run .72s ease-in-out infinite alternate;transform-origin:128px 170px}.blink{animation:blink 3.2s infinite;transform-origin:center}.shine{animation:shine 1.4s ease-in-out infinite alternate}@keyframes float{from{transform:translateY(4px)}to{transform:translateY(-6px)}}@keyframes run{from{transform:rotate(-2.5deg) translateY(2px)}to{transform:rotate(2.5deg) translateY(-3px)}}@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}@keyframes shine{from{opacity:.35}to{opacity:1}}</style>
