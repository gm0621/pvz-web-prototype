<defs>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f0ff"/><stop offset=".55" stop-color="#c8c3e8"/><stop offset="1" stop-color="#928bb6"/></linearGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9f99d"/><stop offset=".5" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a6"/><stop offset=".6" stop-color="#e0ad4b"/><stop offset="1" stop-color="#9a6227"/></linearGradient>
<linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f8cff"/><stop offset="1" stop-color="#4246ae"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8aa0"/><stop offset="1" stop-color="#8e2440"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4156c9"/><stop offset="1" stop-color="#202970"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#111827" flood-opacity=".25"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.line{stroke:#171922;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#171922;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.soft{stroke:#fff;stroke-width:10;stroke-linecap:round;opacity:.42}.float{animation:bob 1.8s ease-in-out infinite alternate;transform-origin:512px 675px}.run{animation:run .72s ease-in-out infinite alternate;transform-origin:512px 700px}.blink{animation:blink 3.4s infinite;transform-origin:center}.shine{animation:shine 1.5s ease-in-out infinite alternate}.cheek{fill:#ff8fb1;opacity:.48}@keyframes bob{from{transform:translateY(7px)}to{transform:translateY(-8px)}}@keyframes run{from{transform:translateY(6px) rotate(-2deg)}to{transform:translateY(-7px) rotate(2deg)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes shine{from{opacity:.45}to{opacity:1}}</style>
</defs>
<g class="float" filter="url(#shadow)">
