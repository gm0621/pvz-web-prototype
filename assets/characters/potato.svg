<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="土豆雷"><style>.bob{animation:bob 1.4s ease-in-out infinite alternate;transform-origin:64px 82px}.blink{animation:blink 2.8s infinite}.glow{animation:glow 1.2s ease-in-out infinite alternate}.run{animation:run .55s ease-in-out infinite alternate;transform-origin:64px 88px}@keyframes bob{from{transform:translateY(2px)}to{transform:translateY(-4px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes glow{from{opacity:.55}to{opacity:1}}@keyframes run{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}</style><rect width="128" height="128" rx="24" fill="#f5e0b7"/><ellipse cx="64" cy="113" rx="34" ry="8" fill="#000" opacity=".22"/><g class="bob"><path d="M34 55c7-25 47-34 66-10 18 22 6 61-23 68-27 7-54-10-49-35 1-8 3-15 6-23z" fill="#b7791f" stroke="#713f12" stroke-width="5"/><circle cx="47" cy="48" r="4" fill="#713f12" opacity=".55"/><circle cx="83" cy="48" r="5" fill="#713f12" opacity=".45"/><circle cx="91" cy="83" r="4" fill="#713f12" opacity=".45"/><g class="blink"><circle cx="53" cy="69" r="5" fill="#111827"/><circle cx="76" cy="69" r="5" fill="#111827"/></g><path d="M54 86q10 7 23 0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><path class="glow" d="M64 26l7 13H57z" fill="#ef4444"/></g></svg>