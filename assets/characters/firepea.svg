<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="火焰豌豆射手"><style>.bob{animation:bob 1.4s ease-in-out infinite alternate;transform-origin:64px 82px}.blink{animation:blink 2.8s infinite}.glow{animation:glow 1.2s ease-in-out infinite alternate}.run{animation:run .55s ease-in-out infinite alternate;transform-origin:64px 88px}@keyframes bob{from{transform:translateY(2px)}to{transform:translateY(-4px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes glow{from{opacity:.55}to{opacity:1}}@keyframes run{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}</style><rect width="128" height="128" rx="24" fill="#fed7aa"/><ellipse cx="64" cy="113" rx="34" ry="8" fill="#000" opacity=".22"/><g class="bob"><path class="glow" d="M57 14c15 13 2 23 16 36 9 9 19 17 16 34-4 23-32 33-53 20-19-12-20-40-5-54 13-12 25-17 30-36z" fill="#fb923c"/><ellipse cx="83" cy="58" rx="28" ry="19" fill="#f97316" stroke="#7c2d12" stroke-width="4"/><circle cx="99" cy="58" r="12" fill="#7c2d12"/><path d="M39 90c-11 1-19 7-25 16 15 6 29 3 40-7" fill="#166534"/><g class="blink"><circle cx="52" cy="64" r="5" fill="#111827"/><circle cx="68" cy="62" r="5" fill="#111827"/></g><path d="M48 79q17 9 33 0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/></g></svg>