<path class="line" fill="url(#gRed)" d="M324 356c49-75 147-85 188-206 45 100 10 157 91 211 88 59 91 203 14 276-88 84-247 62-313-39-45-69-35-161 20-242z"/>
<circle class="line" cx="632" cy="506" r="79" fill="#d9483f"/>
<circle class="line" cx="661" cy="506" r="38" fill="#4c1d1f"/>
<path class="soft" d="M590 464c33-23 80-26 112-5" fill="none"/>
<g class="blink"><ellipse class="line" cx="430" cy="450" rx="41" ry="54" fill="#ffe48a"/><ellipse class="line" cx="544" cy="450" rx="41" ry="54" fill="#ffe48a"/><ellipse cx="444" cy="460" rx="14" ry="20" fill="#26232a"/><ellipse cx="532" cy="460" rx="14" ry="20" fill="#26232a"/></g>
<path class="thin" d="M410 544q75 43 161 0" fill="none"/></g>
</svg>