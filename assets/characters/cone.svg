<linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffce79"/><stop offset=".45" stop-color="#ff7a1a"/><stop offset="1" stop-color="#b83212"/></linearGradient>
