<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="豌豆射手僵屍" class="premium-detail">
<defs>
<radialGradient id="bg" cx="32%" cy="24%" r="78%"><stop offset="0" stop-color="#ede9fe"/><stop offset="0.52" stop-color="#4c1d95"/><stop offset="1" stop-color="#101828"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".48" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#020617" stop-opacity=".75"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".35" stop-color="#94a3b8"/><stop offset=".7" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#020617" flood-opacity=".42"/></filter>
<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.float{animation:float 1.8s ease-in-out infinite alternate;transform-origin:128px 154px}.run{animation:run .72s ease-in-out infinite alternate;transform-origin:128px 170px}.blink{animation:blink 3.2s infinite;transform-origin:center}.shine{animation:shine 1.4s ease-in-out infinite alternate}@keyframes float{from{transform:translateY(4px)}to{transform:translateY(-6px)}}@keyframes run{from{transform:rotate(-2.5deg) translateY(2px)}to{transform:rotate(2.5deg) translateY(-3px)}}@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}@keyframes shine{from{opacity:.35}to{opacity:1}}</style>
</defs>
<rect x="7" y="7" width="242" height="242" rx="42" fill="url(#bg)"/>
<rect x="9" y="9" width="238" height="238" rx="40" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".8"/>
<circle cx="72" cy="54" r="44" fill="#fff" opacity=".08"/>
<ellipse cx="128" cy="222" rx="68" ry="15" fill="#020617" opacity=".38"/>
