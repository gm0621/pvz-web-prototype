<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="向日葵"><style>.bob{animation:bob 1.4s ease-in-out infinite alternate;transform-origin:64px 82px}.blink{animation:blink 2.8s infinite}.glow{animation:glow 1.2s ease-in-out infinite alternate}.run{animation:run .55s ease-in-out infinite alternate;transform-origin:64px 88px}@keyframes bob{from{transform:translateY(2px)}to{transform:translateY(-4px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes glow{from{opacity:.55}to{opacity:1}}@keyframes run{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}</style><rect width="128" height="128" rx="24" fill="#fef3c7"/><ellipse cx="64" cy="113" rx="34" ry="8" fill="#000" opacity=".22"/><g class="bob"><g class="glow" fill="#facc15"><ellipse cx="64" cy="23" rx="9" ry="18"/><ellipse cx="64" cy="105" rx="9" ry="18"/><ellipse cx="23" cy="64" rx="18" ry="9"/><ellipse cx="105" cy="64" rx="18" ry="9"/><ellipse cx="35" cy="35" rx="9" ry="18" transform="rotate(-45 35 35)"/><ellipse cx="93" cy="35" rx="9" ry="18" transform="rotate(45 93 35)"/><ellipse cx="35" cy="93" rx="9" ry="18" transform="rotate(45 35 93)"/><ellipse cx="93" cy="93" rx="9" ry="18" transform="rotate(-45 93 93)"/></g><circle cx="64" cy="64" r="32" fill="#92400e" stroke="#78350f" stroke-width="4"/><circle cx="64" cy="64" r="22" fill="#b45309"/><g class="blink"><circle cx="53" cy="58" r="4" fill="#111827"/><circle cx="75" cy="58" r="4" fill="#111827"/></g><path d="M52 73q12 11 25 0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><path d="M64 96v22" stroke="#166534" stroke-width="8" stroke-linecap="round"/></g></svg>