<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".48" stop-color="#67e8f9" stop-opacity=".55"/><stop offset="1" stop-color="#020617" stop-opacity=".75"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".35" stop-color="#94a3b8"/><stop offset=".7" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
